<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pastor Feedback — The Infinity Map</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00122a;--navy-2:#0a2342;--cream:#faf7f2;--paper:#fff;--gold:#c9a227;--muted:#5b6b7c;--ink:#1c2733;--line:#e7e0d4;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.65;padding:2.5rem 1.25rem 4rem}
  .card{max-width:640px;margin:0 auto}
  .head{text-align:center;margin-bottom:2rem}
  .head img{width:min(180px,45vw);margin:0 auto 1.2rem;display:block}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4.6vw,2.5rem);color:var(--navy);line-height:1.15}
  .tag{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.1rem;margin:.6rem 0 1rem}
  .head p{color:var(--muted)}
  form{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:2rem 1.8rem}
  label{display:block;font-weight:600;color:var(--navy);font-size:.95rem;margin:1.3rem 0 .4rem}
  label:first-of-type{margin-top:0}
  label .opt{font-weight:400;color:var(--muted);font-size:.85rem}
  input[type=text],input[type=email],textarea,select{width:100%;padding:.75rem 1rem;border:1.5px solid var(--line);border-radius:10px;font-family:var(--sans);font-size:.95rem;background:var(--cream);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .radio-row{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.95rem}
  .radio-row label{display:flex;align-items:center;gap:.4rem;font-weight:400;margin:0;color:var(--ink)}
  .btn{display:inline-block;margin-top:1.8rem;padding:.9rem 2.2rem;border-radius:999px;background:var(--navy);color:#fff;font-weight:700;font-size:1rem;border:none;cursor:pointer;font-family:var(--sans);transition:background .2s}
  .btn:hover{background:var(--navy-2)}
  .hp{display:none}
  .home{display:block;text-align:center;margin-top:2rem;color:var(--muted);font-size:.9rem;text-decoration:none}
  .home:hover{color:var(--navy)}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="assets/mark.png" alt="Infinity Map">
      <h1>Thank you for helping us serve churches better</h1>
      <p class="tag">Pastor feedback · The Infinity Map Church Workshop</p>
      <p>Your honest impressions — the good and the needs-work — shape this ministry for every church that comes after yours. Five minutes is a gift.</p>
    </div>
    <form name="pastor-feedback" method="POST" action="/feedback-thanks.html" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="pastor-feedback">
      <p class="hp"><label>Don't fill this out: <input name="bot-field"></label></p>

      <label>Your name &amp; church</label>
      <input type="text" name="name_church" placeholder="Pastor Jane Smith, First Baptist of Springfield" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="you@yourchurch.org" required>

      <label>How far did you get with the materials?</label>
      <select name="usage" required>
        <option value="">Choose one…</option>
        <option>Reviewed the materials only</option>
        <option>Filled in a workbook myself</option>
        <option>Ran part of the workshop</option>
        <option>Ran the full workshop</option>
      </select>

      <label>What worked? What did you or your congregation appreciate most?</label>
      <textarea name="worked" required></textarea>

      <label>What was missing, confusing, or needs to change?<br><span class="opt">Please be blunt — this is the answer that helps most.</span></label>
      <textarea name="improve" required></textarea>

      <label>Would you recommend this workshop to another pastor?</label>
      <div class="radio-row">
        <label><input type="radio" name="recommend" value="Yes, enthusiastically" required> Yes, enthusiastically</label>
        <label><input type="radio" name="recommend" value="Yes, with reservations"> Yes, with reservations</label>
        <label><input type="radio" name="recommend" value="Not yet"> Not yet</label>
      </div>

      <label>Does the pricing ($299–$999 by church size) feel fair? <span class="opt">Optional</span></label>
      <input type="text" name="pricing" placeholder="Too high / about right / a bargain — and why">

      <label>May we quote your feedback publicly (with your name and church)?</label>
      <div class="radio-row">
        <label><input type="radio" name="quote_permission" value="Yes" required> Yes</label>
        <label><input type="radio" name="quote_permission" value="Yes, anonymously"> Yes, but anonymously</label>
        <label><input type="radio" name="quote_permission" value="No"> No</label>
      </div>

      <button class="btn" type="submit">Send Feedback</button>
    </form>
    <a class="home" href="/">← Back to InfinityMap.org</a>
  </div>
</body>
</html>
