<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thank You — The Infinity Map</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00122a;--gold:#c9a227;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:radial-gradient(1200px 600px at 50% -10%,#123256 0%,var(--navy) 55%),var(--navy);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;line-height:1.65;text-align:center}
  .card{max-width:560px}
  .card img{width:min(200px,50vw);margin:0 auto 1.5rem;filter:drop-shadow(0 12px 40px rgba(0,0,0,.45))}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4.6vw,2.6rem);line-height:1.15}
  p{color:rgba(255,255,255,.85);margin-top:1rem}
  .tag{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.15rem}
  a.home{display:inline-block;margin-top:2rem;color:var(--gold);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/mark.png" alt="Infinity Map">
    <h1>Thank you, Pastor</h1>
    <p class="tag">“Because love plans ahead.”</p>
    <p>Your feedback is in our hands, and we don't take it lightly — it will shape this ministry for every church that follows yours. We're grateful for you and for your congregation.</p>
    <a class="home" href="/">← Back to InfinityMap.org</a>
  </div>
</body>
</html>
